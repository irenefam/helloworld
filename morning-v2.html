<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To Do List</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; padding: 32px 16px; font-family: Arial, sans-serif; color: #42343b; background: linear-gradient(135deg, #f2dfc6, #efd0cc, #e7b8c7); }
main { max-width: 560px; margin: auto; padding: 28px; background: #fffaf5; border-radius: 20px; box-shadow: 0 12px 36px #78554b20; }
h1 { margin-bottom: 8px; }
p { line-height: 1.5; }
.intro { color: #705c65; }
form label { display: block; margin-bottom: 8px; }
.row { display: flex; gap: 8px; }
#task { flex: 1; min-width: 0; padding: 12px; border: 1px solid #a78a94; border-radius: 8px; font: inherit; }
button { padding: 12px 20px; border: 0; border-radius: 8px; background: #865368; color: white; font: inherit; cursor: pointer; }
button:hover { background: #6c4052; }
:focus-visible { outline: 3px solid #865368; outline-offset: 3px; }
ul { list-style: none; padding: 0; }
li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eadde0; }
li label { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; cursor: pointer; }
li input { margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; accent-color: #865368; }
li span { overflow-wrap: anywhere; min-width: 0; }
li input:checked + span { text-decoration: line-through; color: #806d75; }
.delete { flex-shrink: 0; width: 44px; height: 44px; padding: 0; background: transparent; color: #865368; font-size: 26px; }
.delete:hover { background: #f3e2e5; }
#notice { color: #8b3500; }
@media (max-width: 400px) { main { padding: 20px; } .row { flex-direction: column; } }
</style>
</head>
<body>
<main>
  <h1>To Do List</h1>
  <p class="intro">A fresh start, one day at a time.</p>
  <form id="form">
    <label for="task">New task</label>
    <div class="row">
      <input id="task" placeholder="What do you need to do?" maxlength="300" required>
      <button type="submit">Add</button>
    </div>
  </form>
  <p id="notice" role="status" hidden></p>
  <h2>Your morning routine</h2>
  <p id="empty" hidden>No tasks yet. Add something just for you.</p>
  <ul id="list" aria-label="Your tasks"></ul>
</main>
<script>
const key = 'morning-todo-standalone-v2';
const input = document.querySelector('#task');
const list = document.querySelector('#list');
const notice = document.querySelector('#notice');
const empty = document.querySelector('#empty');
let tasks = [
  'Drink a glass of water',
  'Take the dog for a morning walk',
  'Feed the dog and refill the water bowl',
  'Stretch for 5 minutes',
  'Take a shower and brush your teeth',
  'Eat a balanced breakfast',
  'Take vitamins if recommended by your doctor',
  'Plan a screen break to move and rest your eyes',
  'Tidy your desk for a calm start to working from home',
  'Take 5 quiet minutes just for yourself'
].map(text => ({ text, completed: false }));

function warn(message) {
  notice.textContent = message;
  notice.hidden = false;
}
try {
  const saved = localStorage.getItem(key);
  if (saved !== null) {
    const data = JSON.parse(saved);
    if (!Array.isArray(data) || !data.every(item =>
      item && typeof item.text === 'string' && item.text.trim() &&
      typeof item.completed === 'boolean'
    )) throw new Error('Invalid saved list');
    tasks = data;
  }
} catch {
  warn('Saved tasks could not be loaded. Showing sample tasks.');
}
function save() {
  try {
    localStorage.setItem(key, JSON.stringify(tasks));
    notice.hidden = true;
  } catch {
    warn('Browser storage is unavailable. Changes may be lost after a refresh.');
  }
}
function render() {
  list.replaceChildren();
  empty.hidden = tasks.length > 0;
  tasks.forEach((task, index) => {
    const li = document.createElement('li');
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = task.completed;
    const text = document.createElement('span');
    text.textContent = task.text;
    checkbox.addEventListener('change', () => {
      task.completed = checkbox.checked;
      save();
    });
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'delete';
    remove.textContent = '×';
    remove.setAttribute('aria-label', 'Delete task: ' + task.text);
    remove.title = 'Delete task';
    remove.addEventListener('click', () => {
      tasks.splice(index, 1);
      save();
      render();
      const buttons = list.querySelectorAll('.delete');
      if (buttons.length) buttons[Math.min(index, buttons.length - 1)].focus();
      else input.focus();
    });
    label.append(checkbox, text);
    li.append(label, remove);
    list.append(li);
  });
}
document.querySelector('#form').addEventListener('submit', event => {
  event.preventDefault();
  const text = input.value.trim();
  if (text) {
    tasks.push({ text, completed: false });
    save();
    render();
  }
  input.value = '';
  input.focus();
});
render();
</script>
</body>
</html>
